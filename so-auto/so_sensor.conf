################################################################################
# Security Onion Sensor Node Configuration
# Role: SENSOR (Distributed Deployment - Existing Deployment)
################################################################################

# Node Role
ROLE="SENSOR"

# Hostname (base - sensor number appended at runtime)
HOSTNAME_BASE="sosensor"

# Network Configuration
NETWORK_RANGE="10.10.20.0/24"
GATEWAY="10.10.20.254"
DNS_SERVER="10.10.20.253"
DNS_SEARCH_DOMAIN="asat.tht"

# Sensor IP addresses by sensor number
# Sensor 1: 10.10.20.52
# Sensor 2: 10.10.20.53
# Sensor 3: 10.10.20.54
# Sensor 4: 10.10.20.55
# Sensor 5: 10.10.20.56
# Sensor 6: 10.10.20.57
SENSOR_IP_BASE="10.10.20.5"
SENSOR_IP_OFFSET="1"

# Manager Connection
MANAGER_HOSTNAME="somanager"
MANAGER_IP="10.10.20.50"

# Analyst Access Range
ANALYST_IP_RANGE="10.10.20.0/24"

